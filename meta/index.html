<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terry Su: Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>Stats about this website's codebase.</p>
    <div>
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100" />
            <time id="commit-time"></time>
        </label>
    </div>
    <div id="stats"></div>
    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <div id="chart"></div>
            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd><a href="" id="commit-link" target="_blank"></a></dd>
                <dt>Date</dt>
                <dd id="commit-date"></dd>
                <dt>Time</dt>
                <dd id="commit-time"></dd>
                <dt>Author</dt>
                <dd id="commit-author"></dd>
                <dt>Lines edited</dt>
                <dd id="commit-lines"></dd>
            </dl>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>
    <dl id="files"></dl>
</body>
</html>
